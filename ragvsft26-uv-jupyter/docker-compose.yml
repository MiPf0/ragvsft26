services:

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragvsft26-jupyter
    env_file:
      - .env
    environment:
      # This overrides anything in the .env file and disables the login screen
      - JUPYTER_TOKEN="abc"
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      # ── Persistent project files ──────────────────────────────
      - .:/workspace

      # ── Persistent uv/pip cache ──────────────────────────────
      - uv-cache:/root/.cache/uv
      - pip-cache:/root/.cache/pip

      # ── Persistent Jupyter config & extensions ───────────────
      - jupyter-data:/root/.jupyter
      - jupyter-local:/root/.local
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: >
      jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --ServerApp.token=${JUPYTER_TOKEN:-dev-token-ragvsft26}
        --notebook-dir=/workspace

volumes:
  uv-cache:
  pip-cache:
  jupyter-data:
  jupyter-local:
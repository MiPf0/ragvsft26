services:

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ragvsft26-jupyter
    env_file:
      - .env
    ports:
      - "${JUPYTER_PORT:-8888}:8888"
    volumes:
      # ── Persistent project files ──────────────────────────────
      - .:/workspace

    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    command: >
      jupyter lab
        --ip=0.0.0.0
        --port=8888
        --no-browser
        --allow-root
        --ServerApp.token=""
        --notebook-dir=/workspace